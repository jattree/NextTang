<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">NextTang</title>
  <desc id="desc">NextTang is a ZX Spectrum Next FPGA port with shared RTL for the non-development Tang Nano 20K target and developer-oriented Tang Console 60K and 138K targets. The project is currently in planning.</desc>

  <defs>
    <linearGradient id="board-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22150c"/>
      <stop offset="1" stop-color="#120f0d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#080a0f"/>
  <path d="M610 42V378" stroke="#202632"/>

  <g id="title-block" transform="translate(58 48)">
    <rect width="6" height="42" rx="3" fill="#f97316"/>
    <text x="24" y="18" fill="#94a3b8" font-size="18" font-weight="600"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          letter-spacing="2">FPGA / ZX SPECTRUM NEXT</text>
    <text x="24" y="42" fill="#f97316" font-size="18" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          letter-spacing="2">COMMUNITY PORT</text>

    <text x="0" y="132" fill="#f8fafc" font-size="76" font-weight="800"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          letter-spacing="-3">NextTang</text>

    <text x="2" y="180" fill="#cbd5e1" font-size="24" font-weight="500"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">One shared core. Three Sipeed Tang targets.</text>
    <text x="2" y="214" fill="#cbd5e1" font-size="24" font-weight="500"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Hardware debugging where resources permit.</text>

    <path d="M2 250H500" stroke="#202632"/>

    <g id="metadata" transform="translate(2 278)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect y="2" width="10" height="10" rx="2" fill="#f97316"/>
      <text x="22" y="13" fill="#94a3b8" font-size="16" letter-spacing="1.5">STATUS</text>
      <text x="22" y="42" fill="#f8fafc" font-size="21" font-weight="700">PLANNING</text>

      <text x="178" y="13" fill="#94a3b8" font-size="16" letter-spacing="1.5">FIRST TARGET</text>
      <text x="178" y="42" fill="#f8fafc" font-size="21" font-weight="700">CONSOLE 138K</text>

      <text x="382" y="13" fill="#94a3b8" font-size="16" letter-spacing="1.5">LICENSE</text>
      <text x="382" y="42" fill="#f8fafc" font-size="21" font-weight="700">GPLv3</text>
    </g>
  </g>

  <g id="architecture" transform="translate(642 42)"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="0" y="17" fill="#94a3b8" font-size="18" font-weight="700"
          letter-spacing="1.8">PLANNED SYSTEM BOUNDARY</text>

    <g id="sources">
      <rect x="0" y="43" width="240" height="64" rx="8" fill="#10141c" stroke="#475569"/>
      <text x="120" y="71" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="650">MiSTer ZXNext</text>
      <text x="120" y="94" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.6">UPSTREAM</text>

      <rect x="270" y="43" width="230" height="64" rx="8" fill="#0b1b20" stroke="#22d3ee"/>
      <text x="385" y="82" text-anchor="middle" fill="#a5f3fc" font-size="20" font-weight="650">Host debugger</text>
    </g>

    <path d="M120 107V128" stroke="#64748b" stroke-width="2"/>
    <path d="M385 107V116H458V145" fill="none" stroke="#22d3ee" stroke-width="2"/>

    <g id="shared-core">
      <rect x="0" y="128" width="500" height="120" rx="12" fill="#111722" stroke="#64748b"/>
      <text x="24" y="165" fill="#f8fafc" font-size="26" font-weight="750">Shared NextTang RTL</text>
      <text x="24" y="194" fill="#94a3b8" font-size="18"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CPU · MMU · VIDEO · AUDIO</text>

      <path d="M24 220H476" stroke="#263141"/>
      <path d="M28 230H476" fill="none"
            stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="230" r="5" fill="#22d3ee"/>
      <circle cx="476" cy="230" r="5" fill="#22d3ee"/>
      <text x="476" y="218" text-anchor="end" fill="#67e8f9" font-size="18" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DEBUG / TRACE</text>
    </g>

    <path d="M250 248V276M75 276H425M75 276V294M250 276V294M425 276V294" fill="none"
          stroke="#64748b" stroke-width="2"/>

    <g id="targets">
      <rect x="0" y="294" width="150" height="68" rx="10" fill="#10141c" stroke="#475569"/>
      <text x="75" y="325" text-anchor="middle" fill="#94a3b8" font-size="17" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">NON-DEV</text>
      <text x="75" y="350" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="750">Nano 20K</text>

      <rect x="175" y="294" width="150" height="68" rx="10" fill="url(#board-fill)" stroke="#f97316"/>
      <text x="250" y="325" text-anchor="middle" fill="#fdba74" font-size="17" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PORTABLE</text>
      <text x="250" y="350" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="750">Console 60K</text>

      <rect x="350" y="294" width="150" height="68" rx="10" fill="url(#board-fill)" stroke="#f97316"/>
      <text x="425" y="325" text-anchor="middle" fill="#fdba74" font-size="17" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">INITIAL</text>
      <text x="425" y="350" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="750">Console 138K</text>
    </g>
  </g>
</svg>
