<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440"
     viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">NextTang YouTube banner</title>
  <desc id="desc">NextTang open-source FPGA development channel branding.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0f"/>
      <stop offset="0.48" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>
    <radialGradient id="orange-glow" cx="0" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="1" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#64748b" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="3" fill="#64748b" fill-opacity="0.2"/>
    </pattern>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#background)"/>
  <rect width="1280" height="1440" fill="url(#orange-glow)"/>
  <rect x="1280" width="1280" height="1440" fill="url(#cyan-glow)"/>
  <rect width="2560" height="1440" fill="url(#grid)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#f97316" stroke-opacity="0.26" stroke-width="5">
      <path d="M0 235H270L380 345H555"/>
      <path d="M0 1190H305L430 1065H640"/>
      <path d="M120 0V180L250 310"/>
      <path d="M430 1440V1285L555 1160"/>
    </g>
    <g stroke="#22d3ee" stroke-opacity="0.25" stroke-width="5">
      <path d="M2560 250H2290L2170 370H1995"/>
      <path d="M2560 1180H2250L2130 1060H1925"/>
      <path d="M2430 0V170L2310 290"/>
      <path d="M2140 1440V1280L2015 1155"/>
    </g>
    <g stroke="#64748b" stroke-opacity="0.22" stroke-width="3">
      <path d="M0 430H290L365 505"/>
      <path d="M0 1010H280L365 925"/>
      <path d="M2560 440H2280L2195 525"/>
      <path d="M2560 1000H2280L2195 915"/>
    </g>
  </g>

  <g fill="#f97316" fill-opacity="0.55">
    <circle cx="270" cy="235" r="10"/><circle cx="555" cy="345" r="10"/>
    <circle cx="305" cy="1190" r="10"/><circle cx="640" cy="1065" r="10"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.55">
    <circle cx="2290" cy="250" r="10"/><circle cx="1995" cy="370" r="10"/>
    <circle cx="2250" cy="1180" r="10"/><circle cx="1925" cy="1060" r="10"/>
  </g>

  <g opacity="0.11" filter="url(#soft-glow)">
    <path d="M170 1110V330H320L735 985V330H895V1110H715L330 500V1110Z" fill="#f97316"/>
    <path d="M1665 330H2390V500H2140V1110H1955V500H1665Z" fill="#22d3ee"/>
  </g>

  <!-- All essential branding stays inside YouTube's 1546 x 423 safe area. -->
  <g transform="translate(507 509)">
    <g transform="translate(40 55)">
      <rect width="260" height="260" rx="58" fill="#080a0f" stroke="#263141" stroke-width="6"/>
      <g opacity="0.7" fill="none" stroke="#475569" stroke-width="5"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 76H55L72 93"/><path d="M24 184H55L72 167"/>
        <path d="M236 76H205L188 93"/><path d="M236 184H205L188 167"/>
      </g>
      <g fill="#64748b">
        <circle cx="24" cy="76" r="7"/><circle cx="24" cy="184" r="7"/>
        <circle cx="236" cy="76" r="7"/><circle cx="236" cy="184" r="7"/>
      </g>
      <path d="M64 180V77C64 69 69 64 77 64H89L143 153V77C143 69 148 64 156 64H165V180H139L86 93V180Z"
            fill="#f97316"/>
      <path d="M138 64H212V89H187V180H162V89H138Z" fill="#22d3ee"/>
      <path d="M71 210H189" stroke="#263141" stroke-width="6" stroke-linecap="round"/>
      <path d="M91 210H169" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
      <circle cx="84" cy="210" r="6" fill="#f97316"/>
      <circle cx="176" cy="210" r="6" fill="#22d3ee"/>
    </g>

    <g transform="translate(355 48)">
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
         font-size="25" font-weight="700" letter-spacing="4">
        <rect x="-12" y="-3" width="1180" height="50" rx="12"
              fill="#080a0f" fill-opacity="0.82"
              stroke="#263141" stroke-opacity="0.55"/>
        <text x="2" y="35" fill="#cbd5e1">OPEN-SOURCE FPGA DEVELOPMENT</text>
        <rect x="718" y="13" width="13" height="13" rx="3" fill="#f97316"/>
        <rect x="741" y="13" width="13" height="13" rx="3" fill="#22d3ee"/>
      </g>

      <text x="0" y="178" fill="#f8fafc" font-size="118" font-weight="800"
            font-family="DejaVu Sans, sans-serif">NextTang</text>
      <rect x="4" y="208" width="930" height="3" fill="#263141"/>
      <rect x="4" y="208" width="175" height="3" fill="#f97316"/>
      <rect x="179" y="208" width="175" height="3" fill="#22d3ee"/>

      <text x="2" y="268" fill="#cbd5e1" font-size="31" font-weight="500"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
        ZX Spectrum Next on Sipeed Tang FPGA
      </text>
      <rect x="-12" y="286" width="1180" height="48" rx="12"
            fill="#080a0f" fill-opacity="0.82"
            stroke="#263141" stroke-opacity="0.55"/>
      <text x="2" y="322" fill="#cbd5e1" font-size="23" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            letter-spacing="2.2">BRING-UP  /  PORTING  /  HARDWARE DEBUGGING</text>
    </g>
  </g>
</svg>
