name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the simulators and assembler the tests invoke
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            iverilog ghdl autoconf flex libfl-dev bison help2man
      - name: Build the pinned Verilator lint tool
        run: |
          version=$(grep -oP '(?<=^NEXTTANG_VERILATOR_REFERENCE_VERSION=).*' toolchain/versions.env)
          git clone --branch "v$version" --depth 1 \
            https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix=/usr/local
          make -C /tmp/verilator -j"$(nproc)"
          sudo make -C /tmp/verilator install
      - name: Build sjasmplus
        run: |
          version=$(grep -oP '(?<=^NEXTTANG_SJASMPLUS_VERSION=).*' toolchain/versions.env)
          git clone --branch "v$version" --depth 1 --recurse-submodules \
            https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus -j"$(nproc)"
          sudo install -m 0755 /tmp/sjasmplus/sjasmplus /usr/local/bin/sjasmplus
      - name: Report the tool versions the gate will use
        run: |
          iverilog -V | head -1
          ghdl --version | head -1
          verilator --version
          sjasmplus --version | head -1

      # hdl-lint skips silently when Verilator is absent, which is right for a
      # developer machine and wrong for CI: a gate that is installed to be
      # skipped is not a gate. Fail the job here if the runner has no Verilator
      # rather than letting `make ci` report a pass it did not earn.
      - name: Require Verilator so the HDL gate cannot silently skip
        run: command -v verilator
      - name: Run deterministic quality gate
        run: make ci
